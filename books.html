<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link href="output.css" rel="stylesheet" />
  <style data-injected="books-grid">
    .books-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 1024px) {
      .books-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      width: 100%;
    }

    .book-cover {
      padding-right: 0.5rem;
    }
  </style>
</head>

<body class="bg-lightbg text-lighttext font-serif p-8">
  <div id="books-grid" class="books-grid"></div>

  <script>
    // To add a book, append an entry to books.json — no HTML editing needed.
    const grid = document.getElementById("books-grid");

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function stars(n) {
      const filled = Math.max(0, Math.min(5, Number(n) || 0));
      return "★".repeat(filled);
    }

    function cardHtml(b) {
      const title = escapeHtml(b.title);
      const cover = escapeHtml(b.cover);
      const review = escapeHtml(b.review || "#");
      const author = escapeHtml(b.author);
      const authorLink = escapeHtml(b.authorLink || "#");
      const finished = escapeHtml(b.finished || "");
      return `
        <div class="items-stretch p-4 space-x-6 border text-black rounded-lg card bg-white shadow-sm flex">
          <div class="flex-shrink-0 w-24 flex items-start book-cover">
            <a href="${review}" target="_blank">
              <img alt="${title}" class="w-full h-auto object-contain rounded" src="${cover}" />
            </a>
          </div>
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <h2 class="text-xl font-bold text-lightaccent book-title">
                <a class="hover:text-lighttextaccent" href="${review}" target="_blank">${title}</a>
              </h2>
              <p class="text-sm text-lighttext">by
                <a class="hover:text-lighttextaccent" href="${authorLink}" target="_blank">${author}</a>
              </p>
              <p class="text-lightaccent text-lg">${stars(b.rating)}</p>
              <p class="text-sm text-lighttext">Finished ${finished}</p>
            </div>
          </div>
        </div>`;
    }

    fetch("books.json")
      .then((r) => r.json())
      .then((books) => {
        grid.innerHTML = books.map(cardHtml).join("");
      })
      .catch((err) => {
        grid.innerHTML = `<p class="text-red-600">Failed to load books.json: ${escapeHtml(err.message)}</p>`;
      });
  </script>
</body>

</html>
